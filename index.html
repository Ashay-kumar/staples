<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J24 Retail Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0f1117; --bg2: #181c27; --bg3: #1e2335; --bg4: #252b40;
  --text: #e8eaf0; --text2: #8b92a8; --text3: #555e7a;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --red: #e05252; --amber: #e09a3c; --green: #4caf7d; --blue: #5b8dee;
  --red-bg: rgba(224,82,82,0.1); --amber-bg: rgba(224,154,60,0.1);
  --green-bg: rgba(76,175,125,0.1); --blue-bg: rgba(91,141,238,0.1);
  --radius: 10px; --radius-lg: 14px; --radius-xl: 20px;
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:var(--font);font-size:14px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg)}

/* LOGIN SCREEN */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:2rem}
.login-logo{font-size:28px;font-weight:600;letter-spacing:-.5px;margin-bottom:6px;color:var(--text)}
.login-logo span{color:var(--blue)}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:2.5rem}
.login-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-xl);padding:2rem;width:100%;max-width:380px}
.login-step{display:none}
.login-step.active{display:block}
.step-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:.75rem}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-btn{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 12px;cursor:pointer;text-align:left;transition:all .15s}
.role-btn:hover{border-color:var(--blue);background:var(--blue-bg)}
.role-btn.selected{border-color:var(--blue);background:var(--blue-bg)}
.rb-icon{font-size:20px;margin-bottom:8px}
.rb-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.rb-sub{font-size:11px;color:var(--text2)}
.login-input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--text);font-family:var(--font);margin-bottom:10px;outline:none}
.login-input:focus{border-color:var(--blue)}
.login-input option{background:var(--bg3)}
.login-btn{width:100%;background:var(--blue);border:none;border-radius:var(--radius);padding:11px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;font-family:var(--font);transition:opacity .15s}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.back-link{font-size:12px;color:var(--text2);cursor:pointer;margin-top:.75rem;display:inline-block}
.back-link:hover{color:var(--text)}
.login-error{font-size:12px;color:var(--red);margin-bottom:8px;display:none}

/* APP SHELL */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:0.5px solid var(--border);padding:1.25rem 0;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{padding:0 1.25rem 1.25rem;font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.3px;border-bottom:0.5px solid var(--border)}
.sidebar-logo span{color:var(--blue)}
.sidebar-user{padding:.75rem 1.25rem;border-bottom:0.5px solid var(--border);margin-bottom:.5rem}
.su-role{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:2px}
.su-name{font-size:13px;font-weight:500;color:var(--text)}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;border-radius:0;transition:all .1s;border-left:2px solid transparent}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--blue);background:rgba(91,141,238,0.08);border-left-color:var(--blue)}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:.75rem 1.25rem .25rem;margin-top:.25rem}
.sidebar-bottom{margin-top:auto;padding:1rem 1.25rem;border-top:0.5px solid var(--border)}
.logout-btn{font-size:12px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:6px}
.logout-btn:hover{color:var(--text2)}
.main{margin-left:220px;padding:1.5rem 1.75rem;min-height:100vh}
.page{display:none}
.page.active{display:block}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem}

/* COMPONENTS */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.card-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.75rem}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.met-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem}
.met-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.met-val{font-size:22px;font-weight:600;letter-spacing:-.5px}
.met-chg{font-size:12px;margin-top:3px}
.chg-up{color:var(--green)}
.chg-down{color:var(--red)}
.chg-flat{color:var(--text2)}
.divider{height:0.5px;background:var(--border);margin:1.25rem 0}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;white-space:nowrap}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-gray{background:rgba(255,255,255,0.06);color:var(--text2)}
.section-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:.6rem}

/* STORE CARDS */
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.store-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .15s}
.store-card:hover{border-color:var(--border2);background:var(--bg3)}
.store-card.critical{border-left:3px solid var(--red)}
.store-card.at-risk{border-left:3px solid var(--amber)}
.store-card.stable{border-left:3px solid var(--green)}
.store-card.moderate{border-left:3px solid var(--text3)}
.sc-name{font-size:12px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-stats{display:flex;gap:8px;font-size:11px;color:var(--text2)}
.sc-bar{height:3px;border-radius:2px;background:var(--bg4);margin-top:6px}
.sc-bar-fill{height:3px;border-radius:2px}
.sc-action{font-size:10px;color:var(--blue);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TASK SYSTEM */
.task-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-priority{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.p1-dot{background:var(--red)}
.p2-dot{background:var(--amber)}
.p3-dot{background:var(--green)}
.task-body{flex:1}
.task-store{font-size:11px;color:var(--text2);margin-bottom:2px}
.task-desc{font-size:13px;font-weight:400;line-height:1.5;margin-bottom:4px}
.task-meta{font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap}
.task-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:var(--font)}
.btn-sm:hover{background:var(--bg4);color:var(--text)}
.btn-sm.primary{background:var(--blue);color:#fff;border-color:transparent}
.btn-sm.primary:hover{opacity:.9}
.btn-sm.danger{background:var(--red-bg);color:var(--red);border-color:transparent}
.empty-state{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius-xl);padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:1.25rem}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.form-input{width:100%;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--font);outline:none}
.form-input:focus{border-color:var(--blue)}
.form-input option{background:var(--bg3)}
textarea.form-input{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem}
.btn{padding:8px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);font-family:var(--font)}
.btn:hover{background:var(--bg4)}
.btn.primary{background:var(--blue);color:#fff;border-color:transparent}
.btn.primary:hover{opacity:.9}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}

/* TABS */
.tab-nav{display:flex;gap:4px;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);padding-bottom:.5rem}
.tab-btn{font-size:13px;padding:5px 14px;border-radius:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-family:var(--font)}
.tab-btn:hover{color:var(--text);background:var(--bg3)}
.tab-btn.active{color:var(--blue);background:var(--blue-bg)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* REMARKS */
.remark-card{background:var(--bg3);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border:0.5px solid var(--border)}
.rc-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rc-name{font-size:12px;font-weight:500}
.rc-ctx{font-size:11px;color:var(--text2)}
.rc-time{font-size:11px;color:var(--text3);margin-left:auto}
.rc-text{font-size:13px;line-height:1.5;margin-bottom:8px}
.rc-response{background:var(--bg4);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2);border-left:2px solid var(--blue)}
.rc-response-label{font-size:10px;color:var(--blue);margin-bottom:3px;font-weight:500}

/* HEATMAP */
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px}
.hm-cell{border-radius:6px;padding:8px 10px;cursor:pointer;transition:opacity .1s}
.hm-cell:hover{opacity:.8}
.hm-name{font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-val{font-size:11px;margin-top:2px}

/* WATERFALL CHART */
.wf-bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding:0 4px}
.wf-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.wf-bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s}
.wf-label{font-size:9px;color:var(--text3);text-align:center;line-height:1.3}
.wf-val{font-size:10px;font-weight:500;text-align:center}

/* INVESTOR LEVEL BADGES */
.l1{background:rgba(91,141,238,0.2);color:var(--blue)}
.l2{background:rgba(76,175,125,0.2);color:var(--green)}
.l3{background:rgba(224,154,60,0.2);color:var(--amber)}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;bottom:auto;position:fixed;top:0;flex-direction:row;align-items:center;padding:.5rem 1rem;border-right:none;border-bottom:0.5px solid var(--border);overflow-x:auto}
  .sidebar-logo{padding:0 1rem 0 0;border-bottom:none;font-size:14px}
  .sidebar-user{display:none}
  .nav-item{padding:6px 10px;font-size:12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--blue)}
  .nav-section,.sidebar-bottom{display:none}
  .main{margin-left:0;margin-top:48px;padding:1rem}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-logo">J24 <span>Retail Intelligence</span></div>
  <div class="login-sub">Bengaluru Store Network · Operational Platform</div>
  <div class="login-card">
    <!-- Step 1: Choose role -->
    <div class="login-step active" id="step1">
      <div class="step-label">Who are you?</div>
      <div class="role-grid">
        <button class="role-btn" onclick="selectRole('founder')" id="role-founder">
          <div class="rb-icon">👑</div>
          <div class="rb-title">Founder</div>
          <div class="rb-sub">Full network view</div>
        </button>
        <button class="role-btn" onclick="selectRole('gm')" id="role-gm">
          <div class="rb-icon">🏢</div>
          <div class="rb-title">GM</div>
          <div class="rb-sub">Cluster manager</div>
        </button>
        <button class="role-btn" onclick="selectRole('ge')" id="role-ge">
          <div class="rb-icon">🏪</div>
          <div class="rb-title">GE</div>
          <div class="rb-sub">Ground executive</div>
        </button>
        <button class="role-btn" onclick="selectRole('investor')" id="role-investor">
          <div class="rb-icon">📊</div>
          <div class="rb-title">Investor</div>
          <div class="rb-sub">Executive view</div>
        </button>
      </div>
    </div>

    <!-- Step 2: Choose name -->
    <div class="login-step" id="step2">
      <div class="step-label" id="step2Label">Select your name</div>
      <div class="login-error" id="loginError">Name not recognised. Please try again.</div>
      <select class="login-input" id="nameSelect" style="display:none"></select>
      <input class="login-input" id="nameInput" type="text" placeholder="Enter your access code" style="display:none">
      <button class="login-btn" id="loginBtn" onclick="doLogin()" disabled>Enter Dashboard</button>
      <div class="back-link" onclick="goBackStep()">← Change role</div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">J24 <span>Retail</span></div>
    <div class="sidebar-user">
      <div class="su-role" id="sidebarRole"></div>
      <div class="su-name" id="sidebarName"></div>
    </div>
    <div id="sidebarNav"></div>
    <div class="sidebar-bottom">
      <div class="logout-btn" onclick="logout()">⬅ Sign out</div>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="taskModal" onclick="closeTaskModal(event)">
  <div class="modal">
    <div class="modal-title">Assign Task</div>
    <div class="modal-sub" id="taskModalStore"></div>
    <div class="form-group">
      <label class="form-label">Problem type</label>
      <select class="form-input" id="taskProblem">
        <option value="Footfall issue">Footfall issue — bills dropping</option>
        <option value="Basket issue">Basket issue — ATV dropping</option>
        <option value="Double stress">Double stress — both falling</option>
        <option value="Category failure">Category failure — specific category down</option>
        <option value="Stock check">Stock check</option>
        <option value="General">General action</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Priority</label>
      <select class="form-input" id="taskPriority">
        <option value="P1">P1 — Today (critical)</option>
        <option value="P2">P2 — This week</option>
        <option value="P3">P3 — Next week</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Task description — what the GE needs to do</label>
      <textarea class="form-input" id="taskDesc" placeholder="e.g. Visit store, check rice stock levels, confirm with store manager why GPS dropped 40% this period, take photo of shelf..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('taskModal').classList.remove('open')">Cancel</button>
      <button class="btn primary" id="assignBtn" onclick="assignTask()">Assign Task</button>
    </div>
  </div>
</div>

<!-- UPDATE TASK MODAL -->
<div class="modal-overlay" id="updateModal" onclick="closeUpdateModal(event)">
  <div class="modal">
    <div class="modal-title">Update Task</div>
    <div class="modal-sub" id="updateModalDesc"></div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select class="form-input" id="updateStatus">
        <option value="in-progress">In Progress — working on it</option>
        <option value="done">Done — completed</option>
        <option value="open">Open — not started</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Your notes — what did you do?</label>
      <textarea class="form-input" id="updateComment" placeholder="e.g. Visited store, found rice stock out since 3 days, spoke to manager, order placed for tomorrow delivery..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Proof link (optional) — paste Google Drive image link</label>
      <input class="form-input" type="text" id="updateProof" placeholder="https://drive.google.com/...">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('updateModal').classList.remove('open')">Cancel</button>
      <button class="btn primary" id="updateBtn" onclick="submitUpdate()">Save Update</button>
    </div>
  </div>
</div>

<!-- REMARK MODAL -->
<div class="modal-overlay" id="remarkModal" onclick="closeRemarkModal(event)">
  <div class="modal">
    <div class="modal-title">Leave a Remark</div>
    <div class="modal-sub" id="remarkModalCtx"></div>
    <div class="form-group">
      <label class="form-label">Your remark</label>
      <textarea class="form-input" id="remarkText" placeholder="e.g. GPS growth looks strong but I'm concerned about ATV trend — is this sustainable?"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('remarkModal').classList.remove('open')">Cancel</button>
      <button class="btn primary" id="remarkBtn" onclick="submitRemark()">Submit Remark</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
// CONFIGURATION
// =====================================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzilDt8p-5B5eNELU1NRHhzyXoJx7Bym0Bu9fMN9ZM-UfqndBkLqOivIR8owaqSqm0/exec';

// =====================================================================

let selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('role-' + role).classList.add('selected');
  setTimeout(() => {
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    setupStep2(role);
  }, 200);
}

function setupStep2(role) {
  const label = document.getElementById('step2Label');
  const sel = document.getElementById('nameSelect');
  const inp = document.getElementById('nameInput');
  const btn = document.getElementById('loginBtn');
  sel.style.display = 'none'; inp.style.display = 'none';
  document.getElementById('loginError').style.display = 'none';

  if (role === 'founder') {
    label.textContent = 'Select your name';
    sel.style.display = 'block';
    sel.innerHTML = '<option value="">Select name...</option>' + FOUNDERS.map(f => `<option value="${f}">${f}</option>`).join('');
    sel.onchange = () => btn.disabled = !sel.value;
  } else if (role === 'gm') {
    label.textContent = 'Select your name';
    sel.style.display = 'block';
    sel.innerHTML = '<option value="">Select GM...</option>' + GMS.map(g => `<option value="${g}">${g}</option>`).join('');
    sel.onchange = () => btn.disabled = !sel.value;
  } else if (role === 'ge') {
    label.textContent = 'Select your name';
    sel.style.display = 'block';
    sel.innerHTML = '<option value="">Select GE...</option>' + GES.map(g => `<option value="${g}">${g}</option>`).join('');
    sel.onchange = () => btn.disabled = !sel.value;
  } else if (role === 'investor') {
    label.textContent = 'Enter your access code';
    inp.style.display = 'block';
    inp.placeholder = 'e.g. Mohan, Naveen, Antony';
    inp.value = '';
    inp.oninput = () => btn.disabled = !inp.value.trim();
  }
  btn.disabled = true;
}

function goBackStep() {
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  selectedRole = null;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
}

function doLogin() {
  const sel = document.getElementById('nameSelect');
  const inp = document.getElementById('nameInput');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  let name = '';
  if (selectedRole === 'investor') {
    name = inp.value.trim();
    const inv = INVESTORS.find(i => i.code.toLowerCase() === name.toLowerCase());
    if (!inv) { errEl.textContent = 'Access code not recognised. Try: Mohan, Naveen, or Antony'; errEl.style.display = 'block'; return; }
    name = inv.code;
  } else {
    name = sel.value;
    if (!name) return;
  }

  USER = { role: selectedRole, name };
  if (selectedRole === 'gm') {
    USER.stores = STORES.filter(s => s.gm === name);
    USER.ges = [...new Set(USER.stores.map(s => s.ge))];
  } else if (selectedRole === 'ge') {
    USER.stores = STORES.filter(s => s.ge === name);
    const gmStore = STORES.find(s => s.ge === name);
    USER.gm = gmStore ? gmStore.gm : '';
  } else if (selectedRole === 'investor') {
    USER.investor = INVESTORS.find(i => i.code === name);
  }

  localStorage.setItem('j24_user', JSON.stringify(USER));
  startApp();
}

function logout() {
  localStorage.removeItem('j24_user');
  USER = null; TASKS = []; REMARKS = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  selectedRole = null;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
}

// =====================================================================
// APP STARTUP
// =====================================================================
function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sidebarRole').textContent = USER.role.toUpperCase();
  document.getElementById('sidebarName').textContent = USER.name;
  buildNav();
  loadData().then(() => {
    const pages = getPages();
    navigateTo(pages[0].id);
  });
}

function getPages() {
  const role = USER.role;
  if (role === 'founder') return [
    {id:'overview', label:'Overview', icon:'📊'},
    {id:'stores', label:'All Stores', icon:'🏪'},
    {id:'tasks', label:'Tasks', icon:'✅'},
    {id:'team', label:'Team', icon:'👥'},
    {id:'remarks', label:'Investor Remarks', icon:'💬'},
  ];
  if (role === 'gm') return [
    {id:'gm_overview', label:'My Cluster', icon:'📊'},
    {id:'gm_stores', label:'My Stores', icon:'🏪'},
    {id:'gm_tasks', label:'Team Tasks', icon:'✅'},
  ];
  if (role === 'ge') return [
    {id:'ge_stores', label:'My Stores', icon:'🏪'},
    {id:'ge_tasks', label:'My Tasks', icon:'✅'},
  ];
  if (role === 'investor') return [
    {id:'inv_overview', label:'Executive View', icon:'📊'},
    {id:'inv_remarks', label:'My Remarks', icon:'💬'},
  ];
  return [];
}

function buildNav() {
  const pages = getPages();
  document.getElementById('sidebarNav').innerHTML = pages.map(p =>
    `<div class="nav-item" id="nav-${p.id}" onclick="navigateTo('${p.id}')">${p.icon} ${p.label}</div>`
  ).join('');

  const main = document.getElementById('mainContent');
  main.innerHTML = pages.map(p => `<div class="page" id="page-${p.id}"></div>`).join('');
}

function navigateTo(pageId) {
  CURRENT_PAGE = pageId;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const navEl = document.getElementById('nav-' + pageId);
  if (navEl) navEl.classList.add('active');
  const pageEl = document.getElementById('page-' + pageId);
  if (pageEl) { pageEl.classList.add('active'); renderPage(pageId); }
}

// =====================================================================
// DATA LOADING
// =====================================================================
async function loadData() {
  try {
    const params = new URLSearchParams({ action: 'getTasks', t: Date.now() });
    if (USER.role === 'ge') params.set('ge', USER.name);
    if (USER.role === 'gm') params.set('gm', USER.name);
    const res = await fetch(SCRIPT_URL + '?' + params);
    const json = await res.json();
    TASKS = json.tasks || [];
  } catch(e) { TASKS = []; }

  if (USER.role === 'founder' || USER.role === 'investor') {
    try {
      const params = new URLSearchParams({ action: 'getRemarks', t: Date.now() });
      if (USER.role === 'investor') params.set('investor', USER.name);
      const res = await fetch(SCRIPT_URL + '?' + params);
      const json = await res.json();
      REMARKS = json.remarks || [];
    } catch(e) { REMARKS = []; }
  }
}

async function refreshData() {
  await loadData();
  renderPage(CURRENT_PAGE);
}

function renderPage(id) {
  const el = document.getElementById('page-' + id);
  if (!el) return;
  const fn = {
    overview: renderFounderOverview,
    stores: renderFounderStores,
    tasks: renderFounderTasks,
    team: renderFounderTeam,
    remarks: renderFounderRemarks,
    gm_overview: renderGMOverview,
    gm_stores: renderGMStores,
    gm_tasks: renderGMTasks,
    ge_stores: renderGEStores,
    ge_tasks: renderGETasks,
    inv_overview: renderInvestorOverview,
    inv_remarks: renderInvestorRemarks,
  }[id];
  if (fn) fn(el);
}

function renderSalesMetrics() {
  const d = SALES_DATA;
  const momGPS = ((d.mtd_gps - d.mtd1_gps) / d.mtd1_gps * 100).toFixed(1);
  const momGPT = ((d.mtd_gpt - d.mtd1_gpt) / d.mtd1_gpt * 100).toFixed(1);
  const atvMTD = (d.mtd_gps / d.mtd_gpt).toFixed(0);
  const atvMTD1 = (d.mtd1_gps / d.mtd1_gpt).toFixed(0);
  const momATV = ((atvMTD - atvMTD1) / atvMTD1 * 100).toFixed(1);
  const fmt = n => n >= 100000 ? (n/100000).toFixed(1)+'L' : n >= 1000 ? (n/1000).toFixed(0)+'K' : n;
  return `
    <div class="grid-4" style="margin-bottom:1.25rem">
      <div class="met-card" style="cursor:pointer" onclick="openRemark('kpi','Network GPS')">
        <div class="met-label">Network GPS (MTD)</div>
        <div class="met-val">₹${fmt(d.mtd_gps)}</div>
        <div class="met-chg ${momGPS>=0?'chg-up':'chg-down'}">${momGPS>=0?'+':''}${momGPS}% vs last period</div>
      </div>
      <div class="met-card" style="cursor:pointer" onclick="openRemark('kpi','Bill Count')">
        <div class="met-label">Bill Count (MTD)</div>
        <div class="met-val">${fmt(d.mtd_gpt)}</div>
        <div class="met-chg ${momGPT>=0?'chg-up':'chg-down'}">${momGPT>=0?'+':''}${momGPT}% vs last period</div>
      </div>
      <div class="met-card" style="cursor:pointer" onclick="openRemark('kpi','ATV')">
        <div class="met-label">Avg Basket (ATV)</div>
        <div class="met-val">₹${atvMTD}</div>
        <div class="met-chg ${momATV>=0?'chg-up':'chg-down'}">${momATV>=0?'+':''}${momATV}% vs last period</div>
      </div>
      <div class="met-card">
        <div class="met-label">AI Insight</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.6;margin-top:4px">${d.insight || 'Upload CSV to generate AI insight'}</div>
      </div>
    </div>`;
}

function filterStoreCards(q) {
  const gm = document.getElementById('gmFilter')?.value || '';
  const ge = document.getElementById('geFilter')?.value || '';
  document.querySelectorAll('.store-card').forEach(c => {
    const name = c.dataset.name || '';
    const cardGM = c.dataset.gm || '';
    const cardGE = c.dataset.ge || '';
    const show = (!q || name.includes(q.toLowerCase())) && (!gm || cardGM === gm) && (!ge || cardGE === ge);
    c.style.display = show ? '' : 'none';
  });
}

function renderFounderTasks(el) {
  const tabs = ['all','open','in-progress','done','overdue'];
  el.innerHTML = `
    <div class="page-title">Tasks</div>
    <div class="page-sub">Assign and track tasks across the network</div>
    <div class="tab-nav">
      ${tabs.map((t,i) => `<button class="tab-btn ${i===0?'active':''}" onclick="switchTaskTab('${t}',this)">${t.charAt(0).toUpperCase()+t.slice(1).replace('-',' ')}</button>`).join('')}
      <button class="tab-btn" style="margin-left:auto;background:var(--blue);color:#fff" onclick="openTaskModal()">+ New Task</button>
    </div>
    <div id="taskTabContent">${renderTaskList('all')}</div>`;
}

function switchTaskTab(filter, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('taskTabContent').innerHTML = renderTaskList(filter);
}

function renderTaskList(filter) {
  let tasks = [...TASKS];
  if (filter === 'overdue') tasks = tasks.filter(t => t.status !== 'done' && isPastDue(t.due_date));
  else if (filter !== 'all') tasks = tasks.filter(t => t.status === filter);
  tasks.sort((a,b) => {const po={P1:0,P2:1,P3:2}; return (po[a.priority]||2)-(po[b.priority]||2);});
  if (!tasks.length) return `<div class="empty-state">No ${filter === 'all' ? '' : filter} tasks</div>`;
  return tasks.map(t => renderTaskRow(t, 'founder')).join('');
}

function renderTaskRow(t, role) {
  const isOverdue = t.status !== 'done' && isPastDue(t.due_date);
  const statusColors = {open:'badge-amber','in-progress':'badge-blue',done:'badge-green',overdue:'badge-red'};
  const statusLabel = isOverdue && t.status!=='done' ? 'Overdue' : t.status;
  return `<div class="task-row">
    <div class="task-priority ${t.priority==='P1'?'p1-dot':t.priority==='P2'?'p2-dot':'p3-dot'}"></div>
    <div class="task-body">
      <div class="task-store">${t.store_name?.replace('J24 - ','') || ''} · GE: ${t.ge_name} · ${t.priority}</div>
      <div class="task-desc">${t.task_description}</div>
      ${t.ge_comment ? `<div style="font-size:11px;color:var(--text2);margin-top:3px;font-style:italic">GE: "${t.ge_comment}"</div>` : ''}
      ${t.proof_link ? `<div style="font-size:11px;margin-top:3px"><a href="${t.proof_link}" target="_blank" style="color:var(--blue)">📎 View proof</a></div>` : ''}
      <div class="task-meta">
        <span class="badge ${statusColors[t.status]||'badge-gray'}">${statusLabel}</span>
        <span>Due: ${t.due_date}</span>
        <span>By: ${t.assigned_by}</span>
        <span>${t.created_at?.split(',')[0] || ''}</span>
      </div>
    </div>
    <div class="task-actions">
      ${role === 'founder' && t.status !== 'done' ? `<button class="btn-sm danger" onclick="escalateTask('${t.task_id}')">Escalate</button>` : ''}
      ${role === 'ge' && t.status !== 'done' ? `<button class="btn-sm primary" onclick="openUpdateModal('${t.task_id}','${(t.task_description||'').replace(/'/g,"\\'")}')">Update</button>` : ''}
    </div>
  </div>`;
}

// =====================================================================
// TASK MODAL
// =====================================================================
function openTaskModal(storeName, bzid, ge, gm) {
  TASK_STORE = storeName ? {name:storeName, bzid:bzid||'', ge:ge||'', gm:gm||''} : null;
  const sub = document.getElementById('taskModalStore');

  if (!storeName && USER.role !== 'founder' && USER.role !== 'gm') {
    // For general task with no store selected
    document.getElementById('taskModal').classList.add('open');
    sub.innerHTML = 'General task — select store';
    return;
  }

  if (!storeName) {
    // Show store selector in modal
    sub.innerHTML = `<select class="form-input" id="modalStoreSelect" onchange="setModalStore(this.value)" style="margin-bottom:8px">
      <option value="">Select store...</option>
      ${(USER.role==='gm'?STORES.filter(s=>s.gm===USER.name):STORES).map(s=>`<option value="${s.name}" data-bzid="${s.bzid}" data-ge="${s.ge}" data-gm="${s.gm}">${s.short}</option>`).join('')}
    </select>`;
  } else {
    sub.textContent = storeName.replace('J24 - ','');
  }
  document.getElementById('taskModal').classList.add('open');
}

function setModalStore(name) {
  const opt = document.querySelector(`#modalStoreSelect option[value="${name}"]`);
  if (opt) TASK_STORE = {name, bzid:opt.dataset.bzid, ge:opt.dataset.ge, gm:opt.dataset.gm};
}

function closeTaskModal(e) {
  if (e.target === document.getElementById('taskModal')) document.getElementById('taskModal').classList.remove('open');
}

async function assignTask() {
  const store = TASK_STORE;
  if (!store?.name) { alert('Please select a store'); return; }
  const desc = document.getElementById('taskDesc').value.trim();
  if (!desc) { alert('Please enter a task description'); return; }
  const btn = document.getElementById('assignBtn');
  btn.disabled = true; btn.textContent = 'Assigning...';
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        action: 'createTask',
        store_name: store.name, bzid: store.bzid,
        ge_name: store.ge, gm_name: store.gm,
        priority: document.getElementById('taskPriority').value,
        problem_type: document.getElementById('taskProblem').value,
        task_description: desc,
        assigned_by: USER.name
      })
    });
    btn.textContent = 'Assigned!';
    document.getElementById('taskDesc').value = '';
    setTimeout(() => {
      document.getElementById('taskModal').classList.remove('open');
      btn.disabled = false; btn.textContent = 'Assign Task';
      refreshData();
    }, 800);
  } catch(e) { btn.disabled=false; btn.textContent='Assign Task'; alert('Could not save. Check connection.'); }
}

function escalateTask(taskId) {
  if (!confirm('Escalate this task? It will be flagged for urgent attention.')) return;
  updateTaskStatus(taskId, 'escalated', '', '');
}

// =====================================================================
// REMARKS
// =====================================================================
let REMARK_CONTEXT_REF = '';

function openRemark(type, ref) {
  if (USER.role !== 'investor') return;
  REMARK_CTX = type;
  REMARK_CONTEXT_REF = ref;
  document.getElementById('remarkModalCtx').textContent = `On: ${ref}`;
  document.getElementById('remarkText').value = '';
  document.getElementById('remarkModal').classList.add('open');
}

function closeRemarkModal(e) {
  if (e.target === document.getElementById('remarkModal')) document.getElementById('remarkModal').classList.remove('open');
}

async function submitRemark() {
  const text = document.getElementById('remarkText').value.trim();
  if (!text) { alert('Please enter your remark'); return; }
  const btn = document.getElementById('remarkBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        action: 'addRemark',
        investor_name: USER.name,
        context_type: REMARK_CTX,
        context_ref: REMARK_CONTEXT_REF,
        remark_text: text
      })
    });
    btn.textContent = 'Submitted!';
    setTimeout(() => {
      document.getElementById('remarkModal').classList.remove('open');
      btn.disabled=false; btn.textContent='Submit Remark';
      refreshData();
    }, 800);
  } catch(e) { btn.disabled=false; btn.textContent='Submit Remark'; alert('Could not save.'); }
}

async function sendResponse(remarkId) {
  const inp = document.getElementById('resp-' + remarkId);
  if (!inp?.value.trim()) return;
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'respondRemark', remark_id: remarkId, response: inp.value.trim() })
    });
    await refreshData();
  } catch(e) { alert('Could not save response.'); }
}

// =====================================================================
// HELPERS
// =====================================================================
function isPastDue(dateStr) {
  if (!dateStr) return false;
  const parts = dateStr.split('/');
  if (parts.length === 3) {
    const d = new Date(parts[2], parts[1]-1, parts[0]);
    return d < new Date();
  }
  return new Date(dateStr) < new Date();
}

// =====================================================================
// INIT — check if already logged in
// =====================================================================
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('j24_user');
  if (saved) {
    try {
      USER = JSON.parse(saved);
      // Re-hydrate derived fields
      if (USER.role === 'gm') {
        USER.stores = STORES.filter(s => s.gm === USER.name);
        USER.ges = [...new Set(USER.stores.map(s => s.ge))];
      } else if (USER.role === 'ge') {
        USER.stores = STORES.filter(s => s.ge === USER.name);
        const gmStore = STORES.find(s => s.ge === USER.name);
        USER.gm = gmStore ? gmStore.gm : '';
      } else if (USER.role === 'investor') {
        USER.investor = INVESTORS.find(i => i.code === USER.name);
      }
      startApp();
    } catch(e) { localStorage.removeItem('j24_user'); }
  }
});
